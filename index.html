<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Desbloqueando Download...</title>
    <style>
        :root {
            --bg: #0d0d0d; --panel: #1a1a1a; --cyan: #00ffcc; --pink: #ff0055; --muted: #888; --text: #fff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; padding: 16px;
            background-color: var(--bg); color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .container { text-align: center; width: min(640px, 100%); }
        h1 { color: var(--cyan); text-transform: uppercase; letter-spacing: 2px; font-size: 1.2rem; }
        .video-placeholder {
            position: relative; width: 100%; aspect-ratio: 16 / 9; background-color: var(--panel);
            border: 2px solid var(--cyan); border-radius: 8px; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); margin-bottom: 20px;
        }
        /* PONTO DE INTEGRAÇÃO: a tag de vídeo da rede de anúncios entra dentro de #ad-slot. */
        #ad-slot { position: absolute; inset: 0; }
        #timer {
            position: relative; font-size: 3rem; font-weight: bold;
            color: var(--pink); text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }
        #timer.done { color: var(--cyan); text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
        .paused-note {
            position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, .7); color: var(--text); font-size: .95rem;
        }
        .video-placeholder.is-paused .paused-note { display: flex; }
        .status { margin-top: 15px; color: var(--muted); font-size: 0.9rem; }
        .status.ok { color: var(--cyan); }
        .status.bad { color: var(--pink); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Assista para liberar o download</h1>
        <div class="video-placeholder" id="player">
            <div id="ad-slot"></div>
            <span id="timer">15</span>
            <div class="paused-note">⏸ Pausado: volte para esta aba para continuar</div>
        </div>
        <div class="status" id="status-text">O download iniciará automaticamente ao final do anúncio.</div>
    </div>
    <script src="app.js"></script>
</body>
</html>
